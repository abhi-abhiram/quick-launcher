[package]
name = "quick-launcher-core"
description = "The quick launcher core: plugins, prefixes, ranking and actions"
version.workspace = true
edition.workspace = true
repository.workspace = true

[features]
# Puts the recording platform in the binary, for the end-to-end test only.
# Release builds never enable it.
recording-platform = []

[dependencies]
quick-launcher-wire.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }
toml.workspace = true
