name: CI

# Manual only: the repository has no Actions minutes. Run
# `python3 tools/check.py` locally instead; switch back to `push` and
# `pull_request` once minutes are available.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The v0 launcher keeps working until the switch to v1 deletes it.
  v0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/test_model.mjs
