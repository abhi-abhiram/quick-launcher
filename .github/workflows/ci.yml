name: CI

# Runs on Tenki runners rather than GitHub-hosted ones. `python3
# tools/check.py` runs the same checks locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: tenki-standard-small-2c-4g
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo clippy -p quick-launcher-core --all-targets --features recording-platform -- -D warnings
      - run: python3 tests/e2e_core.py -v

  # The macOS platform, the apps plugin's bundle search and the Swift app
  # only build or run on a Mac, so this job runs on a GitHub-hosted one.
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: python3 tests/e2e_core.py -v
      - run: swift build -c release --package-path frontends/macos
      - run: swift test --package-path frontends/macos

  install:
    runs-on: tenki-standard-small-2c-4g
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
