name: CI

# Runs on Tenki runners rather than GitHub-hosted ones. `python3
# tools/check.py` runs the same checks locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: tenki-standard-small-2c-4g
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo check -p quick-launcher-core --all-targets --features recording-platform

  # The v0 launcher keeps working until the switch to v1 deletes it.
  v0:
    runs-on: tenki-standard-small-2c-4g
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/test_model.mjs
