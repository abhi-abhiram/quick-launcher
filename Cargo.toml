[workspace]
members = [
    "crates/wire",
    "crates/core",
    "crates/core/fixtures",
    "crates/plugin",
    "plugins/apps",
    "plugins/pi",
    "plugins/terminal",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/abhi-abhiram/quick-launcher"

[workspace.dependencies]
anyhow = "1"
quick-launcher-plugin = { path = "crates/plugin" }
quick-launcher-wire = { path = "crates/wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1.54"
toml = "0.9"
